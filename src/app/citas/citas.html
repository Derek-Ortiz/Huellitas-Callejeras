
<div class="citas-cont">
<h1>CITAS MÉDICAS</h1>

<div class="info-cont">
    <div class="edit">
       <a routerLink="/citas-edit">
          <img src="assets/images/mdi_pen.png" alt="lapiz">
        </a>
    </div>
<div class="citas-cont" *ngIf="citaSeleccionada">
  <h1>CITA MÉDICA</h1>

  <div class="info-cont">
    <h2>{{ citaSeleccionada.titulo }}</h2>
    <h3>Fecha: {{ citaSeleccionada.fecha }}</h3>
    <h3>Lugar: {{ citaSeleccionada.lugar }}</h3>
    <h3>Motivo: {{ citaSeleccionada.motivo }}</h3>
    <h3>Fecha Realización: {{ citaSeleccionada.fechaRealizacion }}</h3>
  </div>
</div>


    <div class="paciente">
        <a href="">
            <img src="/public/mdi_dog.png" alt="paciente">
        </a>
    </div>
</div>
</div>
