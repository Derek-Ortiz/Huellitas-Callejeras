<div class="status-row">
	<button class="status-btn" type="button" (click)="cambiarEstado()" [ngClass]="estados[indiceFromEstado()].clase" aria-pressed="{{estado === 'Adoptado'}}">
		<img src="/assets/images/heart.svg" alt="Estado" class="status-icon">
		<span class="status-text">{{ estados[indiceFromEstado()].texto }}</span>
	</button>

	<button class="btn-tratamientos" type="button">Tratamientos</button>
</div>
