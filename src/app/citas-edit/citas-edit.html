

<div class="citas-cont">
<h1>CITAS MÉDICAS</h1>

<div class="info-cont">
    <div class="edit">
        <img src="/public/mdi_pen.png" alt="lapiz">
    </div>
    <input type="text" [(ngModel)]="cita.titulo" placeholder="Título">
    <input type="text" [(ngModel)]="cita.fecha" placeholder="Fecha">
    <input type="text" [(ngModel)]="cita.lugar" placeholder="Lugar">
    <input type="text" [(ngModel)]="cita.motivo" placeholder="Motivo">
    <input type="text" [(ngModel)]="cita.fechaRealizacion" placeholder="Fecha Realización">
</div>
    <div class="paciente">
        <img src="/public/mdi_dog.png" alt="paciente">
    </div>

     <button (click)="guardar()">Guardar</button>
</div>
