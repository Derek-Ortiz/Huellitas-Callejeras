

<div class="nav-bar">
  <div class="nav-box">
    <div class="back-arrow">
      <a routerLink="" title="Ir a inicio de sesión">
        <img src="/images/Flecha.svg" alt="Volver a inicio de sesión">
      </a>
    </div>

    <div class="nav-title">Expediente del paciente</div>

    <div class="edit-icon">
      <button id="editButton" class="edit-btn" type="button" (click)="toggleEdit()">
        <img src="/Editor-icon.svg" alt="editar">
      </button>
    </div>
  </div>
</div>

<div class="container">
  <div class="profile-section">
    <div class="avatar-container">
      <div class="avatar">
        <img src="/dog.svg" alt="dog" />
      </div>
    </div>

    <div class="profile-info">
      <h1 class="profile-title">Expediente de paciente</h1>
      <app-status-buttons
        [estado]="pacienteEstado"
        (estadoChange)="onEstadoChange($event)"
        (tratamientos)="onTratamientos()">
      </app-status-buttons>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header">Datos de rescate</div>
    <app-expediente-form
      #expForm
      [disabled]="!isEditing"
      [initial]="initialPaciente"
      (save)="onSave($event)">
    </app-expediente-form>
  </div>
</div>
