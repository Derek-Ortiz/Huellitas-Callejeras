<app-header></app-header>

<div class="nav-bar">
  <div class="nav-box">
    <div class="back-arrow">
      <a routerLink="/galeria" title="Ir a inicio de sesión">
        <img src="/assets/images/Flecha.svg" alt="Volver a inicio de sesión">
      </a>
    </div>

    <div class="nav-title">Expediente del paciente</div>

    <div class="edit-icon">
      <button id="editButton" class="edit-btn" type="button" (click)="toggleEdit()">
        <img [src]="isEditing ? '/assets/images/edit-amarillo.svg' : '/assets/images/Editor-icon.svg'" [alt]="isEditing ? 'editar (activo)' : 'editar'">
      </button>
    </div>
  </div>
</div>

<div class="container">
  <div class="profile-section">
    <div class="avatar-container">
      <div class="avatar">
        <label (click)="onAvatarClick($event)" style="display:block; width:100%; height:100%;">
          <img
            [src]="imagePreviews.length ? imagePreviews[0] : '/assets/images/Agregar.svg'"
            alt="dog"
            [class.placeholder]="!imagePreviews.length"
            [class.uploaded]="imagePreviews.length > 0"
          />
        </label>
        <input #avatarInput id="avatarInput" type="file" accept="image/*" (change)="onFilesSelected($event)" style="display:none" />
      </div>
    </div>

    <div class="profile-info">
      <h1 class="profile-title">Expediente de paciente</h1>
      <app-status-buttons
        [estado]="animalEstado"
        (estadoChange)="onEstadoChange($event)"
        (tratamientos)="onTratamientos()">
      </app-status-buttons>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header">Datos de rescate</div>
    <app-expediente-form
      #expForm
      [disabled]="!isEditing"
      [initial]="initialAnimal"
      (save)="onSave($event)"
      (cancel)="onFormCancel()">
    </app-expediente-form>
  </div>
</div>

  <app-modal-desicion *ngIf="showCancelModal" [message]="cancelMessage" (confirmed)="onModalConfirm()" (cancelled)="onModalCancel()"></app-modal-desicion>
