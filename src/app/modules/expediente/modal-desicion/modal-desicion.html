<div class="modal-backdrop">
  <div class="modal">
    <div class="modal-content">
      <p class="modal-message">{{ message }}</p>
      <div class="modal-actions">
        <button class="btn-no" (click)="decline()">Cancelar</button>
        <button class="btn-yes" (click)="confirm()">Aceptar</button>
      </div>
    </div>
  </div>
</div>
