<form
  id="expedienteForm"
  (ngSubmit)="onSubmit()"
  #expedienteForm="ngForm"
  class="form-grid"
  [ngClass]="{ 'disabled': disabled }"
>
  <div class="izquierda">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="model.nombre"
        (ngModelChange)="onFieldChange('nombre',$event)"
        [class.invalid-field]="missingFields.has('nombre')"
        required
        [disabled]="disabled"
      />
    </div>

    <div class="form-group">
      <label for="especie">Especie</label>
      <select
        id="especie"
        name="especie"
        [(ngModel)]="model.especie"
        (ngModelChange)="onFieldChange('especie',$event)"
        [class.invalid-field]="missingFields.has('especie')"
        required
        [disabled]="disabled"
      >
        <option value="">Seleccione...</option>
        <option value="Perro">Perro</option>
        <option value="Gato">Gato</option>
      </select>
    </div>

    <div class="form-group">
      <label for="raza">Raza</label>
      <input
        type="text"
        id="raza"
        name="raza"
        [(ngModel)]="model.raza"
        (ngModelChange)="onFieldChange('raza',$event)"
        [class.invalid-field]="missingFields.has('raza')"
        [disabled]="disabled"
      />
    </div>

    <div class="form-group">
      <label for="edad">Edad</label>
      <input
        type="number"
        id="edad"
        name="edad"
        [(ngModel)]="model.edad"
        (ngModelChange)="onFieldChange('edad',$event)"
        [class.invalid-field]="missingFields.has('edad')"
        min="0"
        [disabled]="disabled"
      />
    </div>

    <div class="form-group">
      <label for="sexo">Sexo</label>
      <select id="sexo" name="sexo" [(ngModel)]="model.sexo" (ngModelChange)="onFieldChange('sexo',$event)" [class.invalid-field]="missingFields.has('sexo')" [disabled]="disabled">
        <option value="">Seleccione...</option>
        <option value="Macho">Macho</option>
        <option value="Hembra">Hembra</option>
      </select>
    </div>

    <div class="form-group">
      <label for="peso">Peso</label>
      <input
        type="number"
        id="peso"
        name="peso"
        [(ngModel)]="model.peso"
        (ngModelChange)="onFieldChange('peso',$event)"
        [class.invalid-field]="missingFields.has('peso')"
        step="0.1"
        [disabled]="disabled"
      />
    </div>

    <div class="form-group">
      <label for="fecha-salida">Fecha de salida</label>
      <input
        type="date"
        id="fecha-salida"
        name="fechaSalida"
        [(ngModel)]="model.fechaSalida"
        [disabled]="disabled"
        readonly
        class="readonly-field"
        title="La fecha de ingreso se genera automáticamente"
      />
      <small class="field-note">Generada automáticamente cuando el estado es adoptado</small>
    </div>
  </div>

  <div class="derecha">
     <div class="form-group">
      <label for="fecha-ingreso">Fecha de ingreso</label>
      <input
        type="date"
        id="fecha-ingreso"
        name="fechaIngreso"
        [(ngModel)]="model.fechaIngreso"
        readonly
        class="readonly-field"
        title="La fecha de ingreso se genera automáticamente"
      />
      <small class="field-note">Generada automáticamente</small>
    </div>

    <div class="form-group">
      <label for="lugar">Lugar</label>
      <input
        type="text"
        id="lugar"
        name="lugar"
        [(ngModel)]="model.lugar"
        (ngModelChange)="onFieldChange('lugar',$event)"
        [class.invalid-field]="missingFields.has('lugar')"
        [disabled]="disabled"
      />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        name="descripcion"
        rows="4"
        [(ngModel)]="model.descripcion"
        (ngModelChange)="onFieldChange('descripcion',$event)"
        [class.invalid-field]="missingFields.has('descripcion')"
        [disabled]="disabled"
      ></textarea>
    </div>
  </div>

  <div class="actions" *ngIf="!disabled">
    <button id="cancelButton" class="btn-cancel" type="button" (click)="onCancel()">Cancelar</button>
    <button id="saveButton" class="btn-agregar" type="submit">Guardar</button>
  </div>
</form>
