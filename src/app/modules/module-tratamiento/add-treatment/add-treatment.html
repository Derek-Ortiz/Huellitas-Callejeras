@if(modalTreatmentEditOpen == true){
    <app-modal-treatment></app-modal-treatment>
}

<div class="main-Card">
    
    <div class="treatments-cards">
        @for(num of nums; track num){
            <div class="treatments-card">
                <h3>Titulos {{num}}</h3>
            </div>

        }
        <div class="add-treatment" routerLink="/medicine/" >
            <a >+</a>
        </div>
    </div>
    <div class="treatment-title">
        <h1>Tratamiento</h1>
        <input type="text" class="request">
    </div>
    <div class="info-card-treat">
        <div class="info-top">
            <div class="treatment-request">
                <p id="start-date">Fecha de inicio</p>
                <input type="date" class="requests">
            </div>
            
            <div class="treatment-request">
                <img src="/docs.png" alt="Docs icon" class="docs">
                <input type="file" class="requests">
            </div>
            
        </div>
        <div class="info-buttom">
            <p id="medicines">Medicamentos</p>
            <div class="plus-card">
                <p class="plus" (click)="OpenModalTreatmentEdit1()">+</p>
            </div>
            

        </div>
    </div>

    <div class="save-btn">
        <button class="save">Guardar</button>
    </div>
</div>
