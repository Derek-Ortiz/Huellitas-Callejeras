@if(modalTreatmentEditOpen == true){
    <app-modal-treatment></app-modal-treatment>
}
@if(modalMedicineOpen == true){
    <app-modal-medicine [initial]="currentInitial" (saved)="onMedicineSaved($event)"></app-modal-medicine>
}

<div class="main-Card">
    <div class="treatments-cards">
        <app-back-button (clickBack)="navigateHome()"></app-back-button>
        @for(num of nums; track num){
            <app-treatment-chip [label]="'Tratamiento ' + num"></app-treatment-chip>
        }
    </div>

    <form [formGroup]="form" (ngSubmit)="save()">
        <div class="side">
            <div class="left-side">
                <div class="treatment-title">
                    <h1>Tratamiento</h1>
                </div>
                <div class="info-card-treat">
                    <div class="info-top">
                        <div class="treatment-request">
                            <p id="start-date">Fecha de inicio</p>
                            <input type="date" class="requests" formControlName="startDate" [ngClass]="{invalid: submitted && form.controls['startDate'].invalid}">
                        </div>
                        <div class="treatment-request">
                            <img src="/docs.png" alt="Docs icon" class="docs">
                            <input type="file" class="requests" (change)="onFileSelected($event)">
                        </div>
                    </div>
                    <div class="info-buttom">
                        <p id="medicines">Medicamentos</p>
                        <div class="plus-card" (click)="openAddMedicineModal()">
                            <p class="plus">+</p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Right side: read-only medicine cards, edited via modal -->
            <div class="right-side">
                @for (medicine of medicines.controls; track $index; let i = $index) {
                    <div class="medicine-list-item">
                        <app-medicine-card
                            [name]="medicine.value.name"
                            [completionDate]="medicine.value.date"
                            [dose]="medicine.value.dose"
                            [repetition]="medicine.value.repetition"
                            (edit)="openEditMedicineModal(i)"
                            (delete)="removeMedicine(i)">
                        </app-medicine-card>
                    </div>
                }
            </div>
        </div>

        <div class="save-btn">
            <button class="save" type="submit">
                <img src="/Save.png" alt="guardar">
            </button>
        </div>
    </form>
</div>

@if(showDeleteConfirm){
    <app-confirm-dialog 
        (cancel)="cancelDelete()" 
        (accept)="confirmDelete()"
        message="¿Deseas eliminar este medicamento?">
    </app-confirm-dialog>
}
