<div class="edit-card">
    
    <div class="card-edit">
        <h1>Editar el medicamento</h1>
        <div class="component-form">
            <h4>Medicamentos</h4>
            <input type="text" class="request">
        </div>
        <div class="component-form">
            <h4>Fecha de conclusion</h4>
            <input type="date" class="request">
        </div>
        <div class="component-form">
            <h4>Dosis</h4>
            <input type="text" class="request">
        </div>
        <div class="component-form">
            <h4>Repetición</h4>
            <input type="text" class="request">
        </div>
        
        <button class="sumit">Subir</button>
        <button class="close" (click)="closeModalMedicineEdit()">X</button>
        
    </div>
</div>
